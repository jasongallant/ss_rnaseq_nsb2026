project:
  type: website
  output-dir: site
  resources:
    - CNAME
  render:
    - index.qmd
    - schedule.qmd
    - episodes/*.Rmd
    - episodes/*.md
    - episodes/marker-explorer.qmd
    - "!bts/" # Ignores an entire folder
    - "!slides/" # Ignores an entire folder
    - "!_includes/" # HTML partials, not pages
    - "!episodes/episodes_style_guide.md"
    - "!episodes/workbook/" # student notebooks, run interactively -- not rendered

website:
  title: "Electric Fish: Single-Nucleus RNA-seq"
  description: "A hands-on lesson on single-nucleus RNA-seq analysis in the context of electric fish biology and hormonal regulation of electric organ discharge."
  repo-url: https://github.com/jasongallant/ss_rnaseq_nsb2026
  repo-actions: [edit, issue]

  navbar:
    logo: episodes/files/shared/efishgenomics_icon.png
    logo-alt: "EFISH Genomics"
    title: "NS&B snRNASeq Tutorial"
    left:
      - text: "Home"
        href: index.html
      - text: "Schedule"
        href: schedule.html
      - text: "Setup"
        href: episodes/setup.html
    right:
      - icon: github
        href: https://github.com/jasongallant/ss_rnaseq_nsb2026
        aria-label: GitHub

  sidebar:
    style: docked
    search: true
    contents:
      - section: "Overview"
        contents:
          - index.qmd
          - schedule.qmd
      - section: "June 8: Introduction, Injection, and EOD Analysis"
        contents:
          - episodes/introduction.Rmd
          - episodes/eod-recording.Rmd # optional background
          - episodes/inject-11kt.Rmd
          - episodes/examine-eod-duration.Rmd
      - section: "June 9: Tissue Dissection"
        contents:
          - episodes/dissection.Rmd
      - section: "June 10: Intro to Single-Nucleus RNA-seq Analysis"
        contents:
          - episodes/introduction_to_rnaseq.Rmd
      - section: "June 11: Isolating Single Nuclei"
        contents:
          - episodes/nuclei_isolation.Rmd
      - section: "June 12: Preprocessing and Batch Correction"
        contents:
          - episodes/introduction_to_rnaseq_computation.Rmd
          - episodes/snrnaseq-preprocessing.Rmd
      - section: "June 13: Cell-Type Annotation and Differential Expression"
        contents:
          - episodes/snrnaseq-annotation-and-de.Rmd
      - "---"
      - episodes/marker-explorer.qmd
      - episodes/setup.md

  page-footer:
    center: "Content by Dr. Jason R. Gallant - Michigan State University &nbsp;|&nbsp; Licensed [CC-BY 4.0](https://creativecommons.org/licenses/by/4.0/) &nbsp;|&nbsp; [Source on GitHub](https://github.com/jasongallant/ss_rnaseq_nsb2026)"

format:
  html:
    include-in-header:
      - _includes/plyr-head.html
      - _includes/callout-icons.html
    include-after-body: _includes/plyr-foot.html
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: false
    code-tools: true
    code-copy: true
    link-external-icon: true
    link-external-newwindow: true

execute:
  freeze: auto
  warning: false
  message: false
